# Your name.
author: Fenodyree

delete-after: True

changes:
  - balance: "Buffs gattling laser modifier charge time from 3 to 2 seconds. It took so long to charge multiple people thought it was bugged."
  - balance: "Tweaks material costs, replacing uranium with silver and gold. Uranium was previously used everywhere."
  - bugfix: "Fixed a bug where energy guns would not properly handle reliability failures when the gun was out of charge."
  - bugfix: "Fixed improvement potential calculations for ions and slimes. You no longer gain improvement shooting monkeys with ions, or for shooting slimes with lasers."
  - bugfix: "Fixed a bug with bluespace capacitors teleporting items in teleport inhibitor range. This was due to the EMP happening before the teleport and destroying the inhibitor."
  - bugfix: "Fixed Ion modulators not correctly decreasing the number of shots."
