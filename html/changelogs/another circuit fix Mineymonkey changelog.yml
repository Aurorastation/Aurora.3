delete-after: True

changes:
  - bugfix: Added some safeties to prevent import loss due to server latency.
  - balance: Reduced the maximum amount of metal and phoron that can be stored in a printer from 500 -> 250 and 20 -> 10 respectively. No cloned circuits can hit those numbers, so this is just a safety measure to prevent accidental loss of materials.
