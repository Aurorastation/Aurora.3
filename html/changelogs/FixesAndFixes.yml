author: TheGreyWikf

delete-after: True

changes:
  - bugfix: "Integrated circuits can now display screen text and other examine related things."
  - bugfix: "Fixed the direction of the wall mounted integrated circuit when placed."
  - bugfix: "Fixed that the integrated circuit kit had the wrong tools."
  - bugfix: "Fixed that the integrated circuit printer put things on the turf instead of in hand."
  - bugfix: "Fixed that removing integrated circuit components put them on the turf, and that they were dropped if they did not fit inside the device."
  - bugfix: "Harvesting a plant multiple times by clicking it repeatedly before it finishes is no longer possible."
  - bugfix: "The kitchen machinery can now be upgraded."
  - bugfix: "The farmbot requirement in bounties was reduced."
  - bugfix: "Fixes the inability to put custom pizzas in the pizza box."
