#   sounddel
#     - (removes a sound)
#   rscadd
#     - (adds a feature)
#   rscdel
#     - (removes a feature)
#   imageadd
#     - (adds an image or sprite)
#   imagedel
#     - (removes an image or sprite)
#   spellcheck
#     - (fixes spelling or grammar)
#   experiment
#     - (experimental change)
#   balance
#     - (balance changes)
#   code_imp
#     - (misc internal code change)
#   refactor
#     - (refactors code)
#   config
#     - (makes a change to the config files)
#   admin
#     - (makes changes to administrator tools)
#   server
#     - (miscellaneous changes to server)
#################################

# Your name.
author: Fenodyree

# Optional: Remove this file after generating master changelog.  Useful for PR changelogs that won't get used again.
delete-after: True

changes:
  - bugfix: "Fixes practice rounds inheriting their parent bullet's armor penetration value."
  - bugfix: "Fixes armor not stripping the bullet flags from bullets that have been blocked by armor, which caused them to embed in organs and cause shrapnel even if they were blocked."
  - bugfix: "Fixes the minimum embed chance remaining at 20% even if the bullet was blocked by armor."
