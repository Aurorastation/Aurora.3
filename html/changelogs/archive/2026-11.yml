2026-11-08:
  FabianK3:
  - admin: Updated the poll creation UI. Converted all inputs into a single TGUI.
2026-11-09:
  FabianK3:
  - server: Added daily pinned rounds. If configured by admins, the server will automatically
      schedule rounds to start a round at the specified time. One round before the
      pinned round an automatic transfer vote is offered to either allow one full
      round before the pinned round or to enforce the current round to be prolonged
      up until the pinned round. The status panel displays the current configuration.
  - admin: Added pinned round time config to server configuration menu.
  TheGreyWolf:
  - rscadd: Money can now be selected where it starts in the origins tab. The current
      options are the bank, a charge card and biesei credits, as well as 50% options
      for the latter two. Tajara can additionally select adhomian knuckles..
  rattydew:
  - bugfix: Resolved a missing accessory sprite for the red Han'san scaleshield custom
      item.
2026-11-11:
  FabianK3:
  - bugfix: Fixed the (hacked) supply beacon activation.
  OstianFox:
  - rscadd: Added Edgar Dawnguard's Custom Item.
  TheGreyWolf:
  - bugfix: Fixed various grab related bugs.
  - bugfix: Fixed the phoron supply monitor TGUI error.
  - bugfix: Fixed dead plants not having a sprite.
  - rscadd: Fixed various remote mech issues.
  - rscadd: Fixed mech weapons not being as accurate as they're supposed to.
  - bugfix: Fixed some incorrect moodlet icon behavior.
  - bugfix: Fixed the IPC surge prevention module having its charges drained too fast.
  - bugfix: The outpost blueprints should now be functional again.
  - bugfix: Fixed skrell and others making foot step sounds and marks even when legless.
  fyni:
  - bugfix: Fixes a typo on the Dominian voidsuit.
2026-11-12:
  Fenodyree:
  - bugfix: Fixes a divide by zero runtime when autoinjectors (and any other 0 time
      do_mob actions) trying to update their progress bars.
2026-11-14:
  DreamySkrell:
  - rscadd: Added cable subtypes for every color (knots, straights, corners, bends,
      up, down).
  - rscadd: Added `/autowire` mapping helpers for each color.
  - rscadd: Added the `autowire` bapi script tool (`tools/bapi/autowire.ps1`), which
      replaces `/autowire` cables on a map with the correct straight/corner/junction
      cables, connecting only to cables of the same color.
  - refactor: Wardrobe vending repath.
  - refactor: Cleans up unused `onstation` vars in vending machines.
  - rscadd: Adds themed wardrobe vendors.
  - rscadd: Adds themed wardrobe item spawn token and maps it to actor and antag areas.
  - bugfix: Map loading now ignores `.mapmanipout.dmm` files generated by the mapmanip
      script, which caused a 'No maps loaded!' crash if left undeleted.
  - rscadd: Added access map markers.
  - rscadd: Added the 'access marker (no access)' map marker.
  - refactor: Cryo outpost map now uses access markers instead of var-edited access.
  ElorgRHG:
  - imageadd: Resprited the G1 Industrial IPC frame.
  - imageadd: Freshened up the sprite of the G2 Industrial IPC frame a bit.
  Fenodyree:
  - bugfix: Fixes modlasers not exploding when fired by turrets or circuits.
  - bugfix: Fixes modlasers exploding faster than they could possibly be repaired.
  - bugfix: Fixes runtimes in handle_post_fire, when any gun is fired by a turret
      or circuit.
  - bugfix: Fixes being unable to throw modlasers on harm intent.
  Hellfirejag:
  - rscadd: Food prepared in cooking appliances by characters with the Cooking skill
      now has a quality rating and provides a morale bonus to whoever eats it, scaling
      with the cook's skill level.
  - rscadd: Ingredients grown by characters with the Gardening skill now also increase
      the quality of food when used by characters with the Cooking skill to prepare
      meals.
  - rscadd: Slicing a skillfully prepared dish preserves its quality and morale bonus
      on each slice.
  - bugfix: Bartending, sabrage, leadership and ministry moodlets no longer overwrite
      a stronger existing moodlet of the same type with a weaker one.
  TheGreyWolf:
  - rscadd: Upgraded the warrant projector to use TGUi and to be able to issue fines.
  - rscadd: Added several new types of vendor viruses.
  - rscadd: Lube is now a bit more visible when on the ground.
  - bugfix: Fixed synthetic blood from the biogenerator not creating bloodstains.
  - bugfix: Fixed pilot movement penalties slowing mechs, missing legs causing pilots
      to collapse inside their cockpit, and dropped items becoming trapped inside
      the mech.
  - rscdel: Removed the lube tanks from maintenance and warehouse random spawn. The
      warehouse side room spawn was left in.
  - bugfix: Fixed welding protection failing in certain specific cases.
  - bugfix: Fixed copied AI holograms missing the target's hair and clothing.
  - bugfix: Allowed AIs to remotely operate the engine control console.
  - bugfix: Fixed AI shells suffering excessive movement delay after pushing objects.
2026-11-16:
  DreamySkrell:
  - rscadd: Adds `/obj/item/clothing` to `whitelisted_check_types` in `/proc/validate_atom_icon`.
  - bugfix: Fixed several clothing items with missing or wrong inventory icons (cyborg
      boots, Santa suit, justice hats, Weishii robe, Jensen shades, glare dampeners,
      and a few others).
  - bugfix: Fixed some maps and ghost roles spawning an invisible, non-existent sandal
      type instead of regular sandals.
  - bugfix: Fixed changeling-fabricated backpacks and belts not falling apart when
      dropped, unlike the rest of their clothing.
  - rscdel: Removed several unused, broken clothing items with no sprites (some heavy
      armor vests, a few dresses, and some other old items).
  - code_imp: Marked many abstract clothing base types as abstract, so they are skipped
      by the icon validation check.
  ElorgRHG:
  - bugfix: Fixed the G2 lights marking.
  FabianK3:
  - bugfix: Fixed a few instances of TGUI alerts causing exceptions.
  GeneralCamo:
  - refactor: Handheld guns and guns operated by integrated circuits now share the
      same firing logic.
  - bugfix: Removing a gun from its firing circuit stops the rest of its burst.
  - rscdel: Routine gunshots no longer print firing messages in chat.
  - qol: Gun safeties, cooldowns, missing firing pins, and jams give short alerts
      near the weapon.
  - rscadd: Self-loading guns with standard detachable magazines retain chambered
      rounds when their magazines are removed. Use Rack to chamber a round after reloading
      an empty gun.
  - qol: On supported pistols, an empty seated magazine blocks racking when the chamber
      has no live round. Remove the magazine to rack it, or replace it to chamber
      a new round.
  - qol: Pistols with slide-lock art show the slide locking back after the last shot.
  - qol: Racking, pumping, and cycling supported guns show a brief text cue to the
      operator and nearby players.
  - rscadd: Added the Eject Ammo action. It drops a seated magazine first, then clears
      a chambered round if there is no seated magazine.
  Hellfirejag:
  - rscadd: Both the Mechanical Engineering and Electrical Engineering skills now
      provide situational modifiers to performing surgeries on an IPC.
  - rscdel: Both the Anatomy and Xenobiology skills can no longer provide their situational
      modifier to IPC surgery.
  - rscadd: Reworked improper surgery surfaces such as rollerbeds to no longer bypass
      the skill check on surgery success chances. They instead provide their own modifier
      that can be offset by a highly skilled surgeon.
2026-11-17:
  DreamySkrell:
  - rscadd: Adds the modular freelancer ship odyssey scenario.
2026-11-21:
  FabianK3:
  - bugfix: Fixed langchat being visible through vacuum borders.
  Geeves:
  - rscadd: Added a Kick maneuver that can be used on harm intent to damage and knock
      back adjacent targets, including movable objects.
  Geeves, Dreamy:
  - rscadd: Shuttles can now rotate to match differently oriented docking landmarks,
      allowing them to use docks that face another direction.
  GeneralCamo:
  - refactor: Refactored say code to live at the atom level.
  Hellfirejag:
  - rscadd: Fully implemented the Forensics skill.
  - rscadd: 'The following can now be painted with a paint gun: Walls, Windows, Window
      Frames, Computers, Chairs, Windoors, Tables, Grates, Vending Machines, Smartfridges.'
  - rscadd: Skills can now selectively change their displayed name and description
      depending on a player character's selected options.
  - rscadd: Tenacity now has an IPC-only variant called Fault-Tolerant Architecture.
      It effectively increases the amount of time for an IPC to permanently die when
      fully disabled.
  - rscadd: Carousing now has an IPC-only variant called Thermal Conditioning. It
      improves the energy efficiency of an IPCs cooling systems.
  - rscadd: Conditioning now has its name and description changed for IPCs to better
      match their concept, displaying its skill name as High-Torque Servos.
  - rscadd: Self Surgery now inflicts a -50 surgery success rate penalty, as well
      as increasing surgery time by 50%.
  - rscadd: Surgeons in pain now take a -painshock penalty to surgery, as well as
      1% increased surgery time per point of pain. This penalty can be mitigated or
      removed by sufficient painkillers.
  TheGreyWolf:
  - balance: Various psionics now account for the user having a psionic blocker such
      as mindshield, being restrained and a couple if the target is protected.
  - rscadd: Added a case of mindshield implants to the warden's office.
  - rscadd: Added legcuffs to the SecTech.
  - rscadd: Added colorable folders to the loadout.
  - rscadd: Added persistence to the booze-o-mat, the dinnerware vending machines
      and the dispensers, including the booze dispenser, soda dispenser and coffee
      master 3000.
  - bugfix: Taj PMCG pharmacists and orderlies can now select the KOG outfit in the
      loadout.
  - rscadd: Machinists can now make console flatpaks.
  - rscadd: Made chainlink fences constructable from steel.
  - rscadd: Added the report editor program.
  - rscadd: Command PDAs now start with better internal storage.
  - rscdel: Removed the gun tracker and news browser from the default program sets.
      They can still be downloaded as usual.
  - rscadd: Command and investigators now have fountain pens in their PDA instead
      of regular pens.
  - bugfix: Fixed queendom and wastelander unathi losing their natural armor.
  notagonk:
  - rscadd: A Gunnery Wing has been created in place of the Grauwolf and Secure Ammunition
      Storage, with the Longbow joining them in a new, dedicated area.
  - rscadd: The Longbow's old location by the Port Docking Arm has been slightly updated.
  rattydew:
  - imageadd: Added unique spriteset for the refill vendor, found in the custodial
      closet.
  - qol: Vendors now provide a little more feedback when refilled and screwdriver'd.
  - bugfix: Fixed bug preventing vendors from rendering lighting after being screwdriver'd.
  - bugfix: Fixed a bug preventing refill inhands from being visible.
  - rscadd: Implemented a remap of the kitchen counter.
2026-11-22:
  GeneralCamo:
  - rscdel: Held radios no longer print to runechat, replicating behavior in /tg/station.
  - bugfix: Radios now respect vacuum.
