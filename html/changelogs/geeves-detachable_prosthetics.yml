changes:
  - rscadd: "Detachable prosthetics now use a multi-step removal procedure."
  - rscadd: "The steps are multitool/screwdriver → multitool → screwdriver → wrench/crowbar → empty hand."
  - rscadd: "Owners can remove their own prosthetics while standing without any skill requirement. Operating on another person requires Familiar Mechanical Engineering and a suitable surgery surface."
  - qol: "Hold a detached prosthetic and use it on yourself with help intent to reattach it."
