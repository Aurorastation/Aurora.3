author: GeneralCamo
delete-after: True
changes:
  - qol: "Lore radios and megaphones now display long overhead speech in successive chunks, splitting at word boundaries where possible."
  - qol: "Overhead speech now measures its text height to accommodate wrapped messages."
  - bugfix: "Overhead speech duration now follows the displayed text length instead of the full, truncated message."
  - qol: "Lore radios retain normal-sized overhead text and use the whisper font at low volume. Megaphones retain amplified text."
  - qol: "Replaced Small Fonts text on HUD counters and map overlays with the bundled pixel fonts."
  - imageadd: "Updated overhead speech icons to TG's versions."
  - qol: "Emotes are no longer automatically italicized in chat."
  - bugfix: "Fixed light-theme heading spacing, MOTD link colors, and the root stylesheet selector."
  - code_imp: "Converted font datums to singletons and removed redundant and obsolete chat styles."
  - qol: "LOOC is now shown in langchat, with special formatting and an icon ported from shiptest."
