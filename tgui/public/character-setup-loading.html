<style>
  #tgui-bootstrap-loader {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: grid;
    grid-template-rows: 32px 1fr;
    color: #d8dee9;
    font:
      16px Arial,
      sans-serif;
    background: #11151c;
  }

  #tgui-bootstrap-loader-titlebar {
    display: flex;
    align-items: center;
    min-width: 0;
    padding-left: 10px;
    border-bottom: 1px solid #05070a;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: bold;
    background: #202833;
    cursor: move;
    user-select: none;
  }

  #tgui-bootstrap-loader-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #tgui-bootstrap-loader-close {
    align-self: stretch;
    width: 42px;
    padding: 0;
    border: 0;
    color: #d8dee9;
    font:
      bold 20px/1 Arial,
      sans-serif;
    background: transparent;
    cursor: pointer;
  }

  #tgui-bootstrap-loader-close:hover {
    color: white;
    background: #c42b1c;
  }

  #tgui-bootstrap-loader-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }

  #tgui-bootstrap-loader-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #334155;
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: tgui-bootstrap-spin 0.8s linear infinite;
  }

  @keyframes tgui-bootstrap-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div id="tgui-bootstrap-loader">
  <div id="tgui-bootstrap-loader-titlebar">
    <div id="tgui-bootstrap-loader-title">Character Setup</div>
    <button
      id="tgui-bootstrap-loader-close"
      type="button"
      aria-label="Close character setup"
      title="Close"
    >
      &times;
    </button>
  </div>
  <div id="tgui-bootstrap-loader-content" role="status">
    <div id="tgui-bootstrap-loader-spinner"></div>
    <div>Loading character setup... (Press F5 if this gets stuck!)</div>
  </div>
</div>

<script>
  (function () {
    var titlebar = document.getElementById('tgui-bootstrap-loader-titlebar');
    var closeButton = document.getElementById('tgui-bootstrap-loader-close');
    var dragging = false;
    var pointerDown = false;
    var dragOffsetX = 0;
    var dragOffsetY = 0;
    var pendingX = 0;
    var pendingY = 0;
    var moveFrame;

    function flushMove() {
      moveFrame = undefined;
      Byond.winset(Byond.windowId, {
        pos: pendingX + ',' + pendingY,
      });
    }

    function moveWindow(event) {
      if (!dragging) {
        return;
      }
      event.preventDefault();
      var scale = window.devicePixelRatio || 1;
      pendingX = Math.round(event.screenX * scale - dragOffsetX);
      pendingY = Math.round(event.screenY * scale - dragOffsetY);
      if (moveFrame === undefined) {
        moveFrame = requestAnimationFrame(flushMove);
      }
    }

    function stopDragging(event) {
      pointerDown = false;
      if (dragging) {
        moveWindow(event);
      }
      dragging = false;
      document.removeEventListener('mousemove', moveWindow);
      document.removeEventListener('mouseup', stopDragging);
    }

    function startDragging(event) {
      if (event.button !== 0 || event.target === closeButton) {
        return;
      }
      event.preventDefault();
      pointerDown = true;
      document.addEventListener('mousemove', moveWindow);
      document.addEventListener('mouseup', stopDragging);
      var scale = window.devicePixelRatio || 1;
      var screenX = event.screenX * scale;
      var screenY = event.screenY * scale;
      Byond.winget(Byond.windowId, 'pos').then(function (position) {
        if (!pointerDown) {
          return;
        }
        dragOffsetX = screenX - position.x;
        dragOffsetY = screenY - position.y;
        dragging = true;
      });
    }

    function closeLoader(event) {
      event.preventDefault();
      pointerDown = false;
      dragging = false;
      document.removeEventListener('mousemove', moveWindow);
      document.removeEventListener('mouseup', stopDragging);
      if (moveFrame !== undefined) {
        cancelAnimationFrame(moveFrame);
        moveFrame = undefined;
      }
      Byond.winset(Byond.windowId, { 'is-visible': false });
      Byond.sendMessage('suspend');
    }

    titlebar.addEventListener('mousedown', startDragging);
    closeButton.addEventListener('click', closeLoader);
  })();
</script>
